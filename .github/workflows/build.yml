name: dev build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: system libs
        run: |
          sudo apt-get update -q
          sudo apt-get install -qy mpv libegl1 libxkbcommon0 libdbus-1-3

      - name: install
        run: |
          pip install -e ".[dev]"
          pip install pyinstaller

      - name: test
        run: pytest -q

      - name: bundle
        run: |
          LIBMPV=$(ldconfig -p | grep -m1 "libmpv.so.1 " | awk '{print $NF}')
          echo "libmpv: $LIBMPV"
          pyinstaller --noconfirm --onefile --name cancha \
            --hidden-import mpv \
            --add-data "cancha/ui/qml:cancha/ui/qml" \
            ${LIBMPV:+--add-binary "$LIBMPV:."} \
            cancha/__main__.py

      - name: appimage tools
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage

      - name: appimage
        env:
          OUTPUT: Cancha-x86_64.AppImage
        run: ./linuxdeploy-x86_64.AppImage --appdir AppDir -e dist/cancha -d assets/cancha.desktop -i assets/icon.png --output appimage

      - name: smoke
        run: |
          ./Cancha-x86_64.AppImage --appimage-extract >/dev/null
          QT_QPA_PLATFORM=offscreen ./squashfs-root/AppRun --shot /tmp/smoke.png --shot-go sports
          ls -la /tmp/smoke.png

      - uses: actions/upload-artifact@v4
        with:
          name: cancha-appimage
          path: Cancha-x86_64.AppImage

      - name: release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body: "Alpha AppImage (linux x86_64, one file). Key via CANCHA_FIREBASE_KEY."
          files: Cancha-x86_64.AppImage
