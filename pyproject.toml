[project]
name = "cancha"
version = "0.1.0"
description = "TV-first sports streaming client for Linux"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "python-mpv>=1.0",
    "requests>=2.31",
    "pycryptodome>=3.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cancha*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
